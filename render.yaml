services:
  - type: web
    name: accounting-collection-dashboard
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      # Set this to your real value in the Render dashboard after the first
      # deploy (Environment tab). Not hardcoded here on purpose - render.yaml
      # is committed to the repo, and this keeps the actual endpoint out of
      # version control even though it isn't a secret per se.
      - key: N8N_WEBHOOK_BASE_URL
        sync: false
