# Local development only: API + PostgreSQL. Nothing here is deployed by Dokploy.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rgf
      POSTGRES_PASSWORD: rgf
      POSTGRES_DB: rgf_core
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rgf -d rgf_core"]
      interval: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://rgf:rgf@db:5432/rgf_core
      SERVICE_API_KEY: dev-only-key
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
volumes:
  pgdata:
